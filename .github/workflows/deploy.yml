name: Deploy Production

on:
  push:
    branches: ["release/v1"]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SAP_API_URL: ${{ secrets.SAP_API_URL }}
          SAP_SERVICE_TOKEN: ${{ secrets.SAP_SERVICE_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DATABASE_URL,JWT_SECRET,FRONTEND_URL,SAP_API_URL,SAP_SERVICE_TOKEN,VITE_API_URL,VITE_WS_URL
          command_timeout: 20m
          script: |
            set -eu

            export NVM_DIR="$HOME/.nvm"
            export PNPM_HOME="$HOME/.local/share/pnpm"

            . "$NVM_DIR/nvm.sh"
            nvm use default

            export PATH="$PNPM_HOME/bin:$PATH"

            node -v
            pnpm -v
            pm2 -v
                      
            cd /home/order-portal

            # Update source
            git fetch origin release/v1
            git checkout release/v1
            git pull --ff-only origin release/v1

            # Backend environment
            umask 077

            {
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
              printf 'SAP_API_URL=%s\n' "$SAP_API_URL"
              printf 'SAP_SERVICE_TOKEN=%s\n' "$SAP_SERVICE_TOKEN"
              printf 'TZ=Asia/Makassar\n'
              printf 'NODE_ENV=production\n'
              printf 'PORT=3001\n'
            } > apps/backend/.env

            # Frontend environment
            {
              printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
              printf 'VITE_WS_URL=%s\n' "$VITE_WS_URL"
            } > apps/frontend/.env.production

            # Dependencies
            pnpm install --frozen-lockfile

            # Prisma Client
            pnpm --filter ./apps/backend db:generate

            # Build backend
            pnpm --filter ./apps/backend build

            # Build frontend
            pnpm --filter ./apps/frontend build

            # Database migration
            pnpm --filter ./apps/backend exec prisma migrate deploy

            # Start or restart applications
            for app in order-portal-backend order-portal-frontend; do
              if pm2 describe "$app" >/dev/null 2>&1; then
                pm2 restart ecosystem.config.js \
                  --only "$app" --update-env
              else
                pm2 start ecosystem.config.js \
                  --only "$app"
              fi
            done

            pm2 save
            pm2 status
