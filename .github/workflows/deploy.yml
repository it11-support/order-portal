name: Deploy Production

on:
  push:
    branches: ['release/v1']

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SAP_API_URL: ${{ secrets.SAP_API_URL }}
          SAP_SERVICE_TOKEN: ${{ secrets.SAP_SERVICE_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DATABASE_URL,JWT_SECRET,FRONTEND_URL,SAP_API_URL,SAP_SERVICE_TOKEN,VITE_API_URL,VITE_WS_URL
          command_timeout: 20m
          script: |
            set -eu

            export NVM_DIR="$HOME/.nvm"
            export PNPM_HOME="$HOME/.local/share/pnpm"

            . "$NVM_DIR/nvm.sh"
            nvm use default

            export PATH="$PNPM_HOME/bin:$PATH"

            node -v
            pnpm -v
            pm2 -v
                      
            cd /home/order-portal

            # Update source
            git fetch origin release/v1
            git checkout release/v1
            git pull --ff-only origin release/v1

            # Backend environment
            umask 022

            {
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
              printf 'SAP_API_URL=%s\n' "$SAP_API_URL"
              printf 'SAP_SERVICE_TOKEN=%s\n' "$SAP_SERVICE_TOKEN"
              printf 'TZ=Asia/Makassar\n'
              printf 'NODE_ENV=production\n'
              printf 'PORT=3001\n'
            } > apps/backend/.env

            # Frontend environment
            {
              printf 'VITE_API_URL=%s\n' "$VITE_API_URL"
              printf 'VITE_WS_URL=%s\n' "$VITE_WS_URL"
            } > apps/frontend/.env.production

            # Dependencies
            pnpm install --frozen-lockfile

            # Prisma Client
            pnpm --filter ./apps/backend exec prisma generate

            # Build Shared
            pnpm --filter @repo/shared build

            # Build backend
            pnpm --filter ./apps/backend build

            # Build frontend
            pnpm --filter ./apps/frontend build
            chmod -R a+rX /home/order-portal/apps/frontend/dist

            # Database migration
            pnpm --filter ./apps/backend exec prisma migrate deploy

            # PM2 deployment
            export NODE_ENV=production
            export PORT=3001
            export TZ=Asia/Makassar

            : "${DATABASE_URL:?Missing DATABASE_URL}"
            : "${JWT_SECRET:?Missing JWT_SECRET}"
            : "${FRONTEND_URL:?Missing FRONTEND_URL}"
            : "${SAP_API_URL:?Missing SAP_API_URL}"
            : "${SAP_SERVICE_TOKEN:?Missing SAP_SERVICE_TOKEN}"

            # Restart with latest ecosystem environment
            pm2 startOrReload ecosystem.config.cjs --update-env

            # Verify backend configuration
            pm2 jlist | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const apps = JSON.parse(input);
                const backend = apps.find(app => app.name === "order-portal-backend");
                const frontend = apps.find(app => app.name === "order-portal-frontend");

                if (!backend || backend.pm2_env.status !== "online") {
                  console.error("Backend is not online");
                  process.exit(1);
                }

                if (!frontend || frontend.pm2_env.status !== "online") {
                  console.error("Frontend is not online");
                  process.exit(1);
                }

                if (backend.pm2_env.SAP_API_URL !== process.env.SAP_API_URL) {
                  console.error("SAP_API_URL mismatch");
                  process.exit(1);
                }

                console.log("PM2 applications and SAP_API_URL verified");
              });
            '

            pm2 save
            pm2 status
