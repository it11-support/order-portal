
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "daily"

    open-pull-requests-limit: 10

    versioning-strategy: increase

    groups:
      nextjs:
        applies-to: version-updates
        patterns:
          - "next"
          - "eslint-config-next"

      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      turbo:
        applies-to: version-updates
        patterns:
          - "turbo"
          - "@turbo/*"

      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
