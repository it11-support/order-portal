services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_portal
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: superSecretPassword
      TZ: Asia/Makassar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: